<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Benjamín Esponda García</title>
  <desc id="d">Corporate lawyer in energy and infrastructure, Mexico City. Law, compiled.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#eceee6" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfff45" stop-opacity=".22"/>
      <stop offset="1" stop-color="#cfff45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0a0c10" stop-opacity="1"/>
      <stop offset=".55" stop-color="#0a0c10" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0a0c10" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="20"/></clipPath>
    <style>
      .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .serif{font-family:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-style:italic}
      .glyph{transform-box:fill-box;transform-origin:center}
      .sec{animation:swapA 7s ease-in-out infinite}
      .brace{animation:swapB 7s ease-in-out infinite}
      .halo{transform-box:fill-box;transform-origin:center;animation:breathe 7s ease-in-out infinite}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .tok{opacity:0;transform-box:fill-box;animation:drift 9s linear infinite}
      .t2{animation-delay:1.5s}.t3{animation-delay:3s}.t4{animation-delay:4.5s}.t5{animation-delay:6s}.t6{animation-delay:7.5s}
      .scan{animation:scan 7s ease-in-out infinite}
      @keyframes swapA{0%,38%{opacity:1;transform:scale(1)}50%,88%{opacity:0;transform:scale(.86)}100%{opacity:1;transform:scale(1)}}
      @keyframes swapB{0%,38%{opacity:0;transform:scale(1.12)}50%,88%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
      @keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes drift{0%{opacity:0;transform:translateY(18px)}15%{opacity:.55}70%{opacity:.35}100%{opacity:0;transform:translateY(-46px)}}
      @keyframes scan{0%,40%{transform:translateY(-60px);opacity:0}45%{opacity:.5}60%{transform:translateY(330px);opacity:0}100%{transform:translateY(330px);opacity:0}}
      @media (prefers-reduced-motion:reduce){
        .sec,.brace,.halo,.cursor,.tok,.scan{animation:none}
        .brace,.scan{opacity:0}.tok{opacity:.35}
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#0a0c10"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <circle class="halo" cx="930" cy="200" r="230" fill="url(#glow)"/>
    <rect width="1200" height="400" fill="url(#fade)"/>

    <!-- window chrome -->
    <g transform="translate(56 52)">
      <circle r="5" fill="#ff5d47"/><circle cx="18" r="5" fill="#ffb648"/><circle cx="36" r="5" fill="#cfff45"/>
      <text x="60" y="4.5" class="mono" font-size="13" fill="#969dab" letter-spacing=".5">~/BEG-lag/README.md</text>
    </g>

    <!-- identity -->
    <text x="56" y="150" class="sans" font-size="54" font-weight="700" fill="#eceee6" letter-spacing="-1">Benjamín Esponda García</text>
    <text x="58" y="192" class="mono" font-size="17" fill="#969dab">corporate lawyer <tspan fill="#cfff45">·</tspan> energy &amp; infrastructure <tspan fill="#cfff45">·</tspan> mexico city</text>

    <!-- motto -->
    <g transform="translate(56 286)">
      <text class="serif" font-size="64" fill="#eceee6">Law,</text>
      <clipPath id="typed"><rect x="134" y="-50" width="0" height="70">
        <animate attributeName="width" begin=".6s" dur="1.6s" fill="freeze" calcMode="discrete" values="0;31;57;84;110;136;163;189;216;242;262"/>
      </rect></clipPath>
      <text x="138" y="0" class="mono" font-size="44" font-weight="700" fill="#cfff45" clip-path="url(#typed)">compiled.</text>
      <g class="cursor"><rect x="138" y="-36" width="22" height="44" fill="#cfff45">
        <animate attributeName="x" begin=".6s" dur="1.6s" fill="freeze" calcMode="discrete" values="142;169;195;222;248;274;301;327;354;380;394"/>
      </rect></g>
    </g>
    <text x="58" y="348" class="mono" font-size="14" fill="#969dab">claude code plugins <tspan fill="#cfff45">/</tspan> mcp servers <tspan fill="#cfff45">/</tspan> legal rag <tspan fill="#cfff45">/</tspan> data pipelines <tspan fill="#cfff45">/</tspan> n8n</text>

    <!-- glyph: § becomes { } -->
    <g transform="translate(930 200)">
      <circle r="132" fill="none" stroke="#cfff45" stroke-opacity=".25" stroke-dasharray="2 10"/>
      <circle r="96" fill="none" stroke="#eceee6" stroke-opacity=".08"/>
      <text class="glyph sec serif" y="62" text-anchor="middle" font-size="190" fill="#eceee6">§</text>
      <text class="glyph brace mono" y="40" text-anchor="middle" font-size="120" font-weight="700" fill="#cfff45">{ }</text>
      <rect class="scan" x="-150" y="-170" width="300" height="2" fill="#cfff45"/>
    </g>

    <!-- drifting tokens -->
    <g class="mono" font-size="13" fill="#cfff45">
      <text class="tok" x="752" y="96">art. 27</text>
      <text class="tok t2" x="1070" y="118">DOF</text>
      <text class="tok t3" x="1086" y="320">mcp</text>
      <text class="tok t4" x="760" y="330">rag</text>
      <text class="tok t5" x="1010" y="64">uv run</text>
      <text class="tok t6" x="820" y="370">git log --law</text>
    </g>

    <rect width="1199" height="399" x=".5" y=".5" rx="20" fill="none" stroke="#eceee6" stroke-opacity=".14"/>
  </g>
</svg>
