<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-labelledby="t d">
  <title id="t">Hoy en el DOF: miércoles 25 de noviembre de 2026</title>
  <desc id="d">Hoy en el DOF, miércoles 25 de noviembre de 2026. Norma Oficial Mexicana NOM-023-ASEA-2026, Estaciones de Servicio con fin Específico para Expendio al Público de gasolinas y/o diésel para Vehículos Automotores (cancela a la NOM-005-ASEA-2016, Diseño, construcción, operación y Mantenimiento de Estaciones de Servicio para almacenamiento y expendio… 80 notas, 59 de ellas avisos. FIX 19.3668. UDI 8.932476. Fuente: DOF / SIDOF.</desc>
  <style>
    .dot{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .ring{animation:ring 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
    .sheen{animation:sheen 7s ease-in-out infinite}
    .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
    .r1{animation-delay:.12s}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
    @keyframes ring{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
    @keyframes sheen{0%,70%{transform:translateX(-200px)}100%{transform:translateX(1160px)}}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.dot,.ring,.sheen,.rise{animation:none}.ring,.sheen{opacity:0}}
  </style>
