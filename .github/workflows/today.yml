name: Today in the DOF

# Every morning at 09:05 in Mexico City (15:05 UTC, Monday to Saturday) render
# assets/today.svg and the README block with the day's Diario Oficial headline,
# note count, FIX and UDIS, read from the official SIDOF API. Commits only when
# something changed. If SIDOF is down, scripts/today.py keeps the previous card
# and exits 0.
on:
  schedule:
    - cron: "5 15 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: today
  cancel-in-progress: false

jobs:
  update:
    name: Refresh the DOF card
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m pip install --quiet --disable-pip-version-check pytest
          python -m pytest -q -p no:cacheprovider tests

      - name: Render card and README block
        id: render
        run: python scripts/today.py

      - name: Commit if changed
        env:
          EDITION: ${{ steps.render.outputs.edition }}
        run: |
          git add assets/today.svg README.md README.es.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(today): DOF card for ${EDITION:-the latest edition}"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
